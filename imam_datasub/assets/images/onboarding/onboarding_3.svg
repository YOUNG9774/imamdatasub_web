<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B35"/>
      <stop offset="100%" stop-color="#5835E8"/>
    </linearGradient>
    <linearGradient id="giftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFE8DD"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Backdrop -->
  <circle cx="400" cy="400" r="380" fill="url(#bgGrad)"/>
  <circle cx="400" cy="400" r="380" fill="url(#glow)"/>

  <!-- Dashed connector arc between the two people -->
  <path d="M 235 470 Q 400 360 565 470" fill="none" stroke="#FFFFFF" stroke-opacity="0.55"
        stroke-width="6" stroke-dasharray="2 22" stroke-linecap="round"/>

  <!-- Sparkles -->
  <g fill="#FFFFFF" fill-opacity="0.85">
    <path d="M150 230 l8 20 20 8 -20 8 -8 20 -8-20 -20-8 20-8 z"/>
    <path d="M645 250 l6 15 15 6 -15 6 -6 15 -6-15 -15-6 15-6 z"/>
    <path d="M600 560 l5 13 13 5 -13 5 -5 13 -5-13 -13-5 13-5 z"/>
  </g>

  <!-- Left person (referrer) -->
  <g>
    <circle cx="225" cy="440" r="92" fill="#FFFFFF" fill-opacity="0.14"/>
    <!-- body -->
    <path d="M170 545 C170 480 190 455 225 455 C260 455 280 480 280 545 Z" fill="#1C2340"/>
    <!-- collar accent -->
    <path d="M203 462 L225 480 L247 462" fill="none" stroke="#FF6B35" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- head -->
    <circle cx="225" cy="405" r="38" fill="#C88355"/>
    <!-- hair -->
    <path d="M188 398 C188 368 205 352 225 352 C247 352 262 368 262 396 C255 384 245 378 225 378 C207 378 195 384 188 398 Z" fill="#241708"/>
    <!-- smile -->
    <path d="M209 415 Q225 428 241 415" fill="none" stroke="#5A3420" stroke-width="4" stroke-linecap="round"/>
    <!-- raised arm holding gift -->
    <path d="M270 490 C300 470 318 445 322 415" fill="none" stroke="#C88355" stroke-width="20" stroke-linecap="round"/>
  </g>

  <!-- Right person (friend) -->
  <g>
    <circle cx="575" cy="440" r="92" fill="#FFFFFF" fill-opacity="0.14"/>
    <path d="M520 545 C520 480 540 455 575 455 C610 455 630 480 630 545 Z" fill="#1C2340"/>
    <path d="M553 462 L575 480 L597 462" fill="none" stroke="#3D5AFE" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="575" cy="405" r="38" fill="#8B5A2B"/>
    <path d="M538 398 C538 368 555 352 575 352 C597 352 612 368 612 396 C605 384 595 378 575 378 C557 378 545 384 538 398 Z" fill="#1A1006"/>
    <path d="M559 415 Q575 428 591 415" fill="none" stroke="#4A2A15" stroke-width="4" stroke-linecap="round"/>
    <!-- reaching arm toward gift -->
    <path d="M530 490 C500 470 482 445 478 415" fill="none" stroke="#8B5A2B" stroke-width="20" stroke-linecap="round"/>
  </g>

  <!-- Gift box passed between them -->
  <g transform="translate(400 400)">
    <rect x="-58" y="-40" width="116" height="92" rx="10" fill="url(#giftGrad)"/>
    <rect x="-58" y="-40" width="116" height="26" rx="8" fill="#FFFFFF"/>
    <rect x="-10" y="-40" width="20" height="92" fill="#FF6B35"/>
    <rect x="-58" y="-11" width="116" height="18" fill="#FF6B35"/>
    <!-- ribbon bow -->
    <path d="M-10 -40 C-38 -66 -50 -30 -10 -22 Z" fill="#FF6B35"/>
    <path d="M10 -40 C38 -66 50 -30 10 -22 Z" fill="#FF6B35"/>
  </g>

  <!-- Floating naira coins -->
  <g>
    <circle cx="255" cy="270" r="30" fill="#FFD447"/>
    <circle cx="255" cy="270" r="30" fill="none" stroke="#E8A800" stroke-width="3"/>
    <text x="255" y="281" font-family="Arial, sans-serif" font-size="28" font-weight="700"
          fill="#8A5A00" text-anchor="middle">N</text>

    <circle cx="545" cy="300" r="24" fill="#FFD447"/>
    <circle cx="545" cy="300" r="24" fill="none" stroke="#E8A800" stroke-width="3"/>
    <text x="545" y="309" font-family="Arial, sans-serif" font-size="22" font-weight="700"
          fill="#8A5A00" text-anchor="middle">N</text>

    <circle cx="400" cy="215" r="20" fill="#FFD447"/>
    <circle cx="400" cy="215" r="20" fill="none" stroke="#E8A800" stroke-width="3"/>
    <text x="400" y="223" font-family="Arial, sans-serif" font-size="18" font-weight="700"
          fill="#8A5A00" text-anchor="middle">N</text>
  </g>
</svg>
